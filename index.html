<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0c0b">
  <title>Menü</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=Cairo:wght@500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>html,body{background:#0d0c0b;color:#f4ede3}</style>
  <style>
:root{
  --accent:#ff6a2b;
  --bg:#0d0c0b; --ink:#f4ede3; --mute:#9b9186; --line:rgba(244,237,227,.1); --card:#171513;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}

/* ---------- arka plan: yavaş akan ışık kürecikleri + film greni + imleç ışığı ---------- */
.bg{position:fixed;inset:0;z-index:-1;background:var(--bg);overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
.b1{width:62vmax;height:62vmax;left:-22vmax;top:-26vmax;background:radial-gradient(circle,var(--accent),transparent 68%);animation:drift1 22s ease-in-out infinite alternate}
.b2{width:48vmax;height:48vmax;right:-20vmax;top:30vh;background:radial-gradient(circle,#7a1f12,transparent 68%);animation:drift2 28s ease-in-out infinite alternate;opacity:.6}
.b3{width:40vmax;height:40vmax;left:10vw;bottom:-24vmax;background:radial-gradient(circle,#3b2a12,transparent 68%);animation:drift3 24s ease-in-out infinite alternate}
.spot{position:absolute;inset:0;background:radial-gradient(420px 420px at var(--mx,50%) var(--my,30%),color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%);transition:background .2s}
.grain{position:absolute;inset:-50%;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1.2s steps(6) infinite}
@keyframes drift1{to{transform:translate(14vmax,10vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-16vmax,-12vmax) scale(1.2)}}
@keyframes drift3{to{transform:translate(18vmax,-8vmax) scale(.9)}}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-4%)}60%{transform:translate(-3%,-2%)}80%{transform:translate(4%,3%)}100%{transform:translate(0,0)}}

#app{max-width:720px;margin:0 auto;padding:0 18px calc(46px + env(safe-area-inset-bottom));position:relative}
body.admin-mode #app,body.admin-mode #sheet,body.admin-mode #ar,body.admin-mode .bg{display:none}

/* ---------- üst ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 2px 0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;color:var(--accent);letter-spacing:.5px;flex:none;position:relative}
.mark::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand b{display:block;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.2px;line-height:1}
.brand small{display:block;margin-top:5px;color:var(--mute);font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase}
.open{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;padding:7px 12px;border:1px solid var(--line);border-radius:99px;color:var(--mute);display:flex;align-items:center;gap:7px;flex:none}
.open i{width:6px;height:6px;border-radius:50%;background:#35d07f;box-shadow:0 0 0 0 #35d07f88;animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px #35d07f00}100%{box-shadow:0 0 0 0 #35d07f00}}

.headline{margin:34px 2px 0;font-family:var(--display);font-weight:800;font-size:clamp(46px,14vw,84px);line-height:.92;letter-spacing:-.03em}
.headline span{display:block;overflow:hidden}
.headline span>em{display:block;font-style:normal;transform:translateY(105%);animation:rise .9s cubic-bezier(.2,.9,.2,1) forwards}
.headline span:nth-child(2)>em{animation-delay:.12s;color:transparent;-webkit-text-stroke:1.5px var(--ink)}
@keyframes rise{to{transform:none}}
.marquee{margin:26px -18px 0;overflow:hidden;border-block:1px solid var(--line);padding:11px 0;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.track{display:flex;width:max-content;animation:slide 26s linear infinite}
.track span{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.28em;white-space:pre;color:var(--mute)}
.track span b{color:var(--accent);font-weight:700}
@keyframes slide{to{transform:translateX(-50%)}}

.search{position:relative;margin:22px 0 4px}
.search input{width:100%;padding:16px 18px 16px 50px;border-radius:18px;border:1px solid var(--line);background:rgba(244,237,227,.04);color:var(--ink);font:500 15px var(--body);outline:none;transition:.3s;backdrop-filter:blur(8px)}
.search input::placeholder{color:var(--mute)}
.search input:focus{border-color:var(--accent);background:rgba(244,237,227,.07);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--mute)}

.sec{display:flex;align-items:flex-end;justify-content:space-between;margin:34px 2px 14px}
.sec h2{margin:0;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.sec span{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mute)}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(26px) scale(.98);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}

/* ---------- kategori kartları: 2 sütun kare ---------- */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;perspective:1100px}
.cat{position:relative;aspect-ratio:1/1;border-radius:28px;overflow:hidden;text-align:left;background:var(--card);border:1px solid var(--line);transform-style:preserve-3d}
.cat.rv.in{transition:transform .25s ease-out,opacity .8s,box-shadow .4s}
.cat img{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.8,.2,1);filter:saturate(1.08) contrast(1.04)}
.cat::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.35) 0,transparent 32%,rgba(8,6,5,.9) 100%)}
.cat:hover img,.cat:active img{transform:scale(1.12)}
.cat .no{position:absolute;left:16px;top:14px;z-index:2;font:700 12px var(--display);letter-spacing:.2em;color:rgba(255,255,255,.85)}
.cat .go{position:absolute;right:12px;top:12px;z-index:2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);transition:.35s}
.cat:hover .go,.cat:active .go{background:var(--accent);border-color:var(--accent);transform:rotate(45deg)}
.cat .lbl{position:absolute;left:16px;right:14px;bottom:15px;z-index:2}
.cat .lbl b{display:block;font:800 20px/1.05 var(--display);letter-spacing:-.01em}
.cat .lbl small{display:block;margin-top:6px;color:rgba(255,255,255,.65);font-size:11px;letter-spacing:1.4px;text-transform:uppercase}

/* ---------- öne çıkanlar ---------- */
.rail{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:2px 18px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.fcard{flex:none;width:172px;scroll-snap-align:start;text-align:left;position:relative;aspect-ratio:4/5;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.fcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.fcard:active img{transform:scale(1.08)}
.fcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(8,6,5,.92))}
.fcard .in{position:absolute;left:12px;right:12px;bottom:12px;z-index:2}
.fcard b{display:block;font:700 15px/1.15 var(--display)}
.fcard .badges{position:absolute;left:10px;top:10px;z-index:2}

/* ---------- rozet & fiyat ---------- */
.badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{font:700 9.5px var(--body);letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:rgba(13,12,11,.7);backdrop-filter:blur(6px);border:1px solid var(--line)}
.badge.new{background:#e8ff59;color:#14180a;border-color:transparent}
.badge.camp{background:var(--accent);color:#1a0b04;border-color:transparent}
.badge.off{background:#f4ede3;color:#14110d;border-color:transparent}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:5px}
.pr b{font:800 1.05em var(--display);color:var(--ink);letter-spacing:-.01em}
.pr b.sale{color:var(--accent)}
.pr s{color:var(--mute);font-size:.82em}

/* ---------- kategori sayfası ---------- */
.bar{position:sticky;top:0;z-index:20;margin:0 -18px;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;background:linear-gradient(rgba(13,12,11,.92) 70%,transparent);backdrop-filter:blur(10px)}
.bar-row{display:flex;align-items:center;gap:14px}
.back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;transition:.25s}
.back:hover{border-color:var(--accent);color:var(--accent)}
.bar h2{margin:0;font:800 28px/1 var(--display);letter-spacing:-.025em}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--mute);transition:.3s}
.chip.on{background:var(--ink);color:#14110d;border-color:var(--ink);font-weight:700}
.list{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.row{display:grid;grid-template-columns:128px 1fr;gap:16px;text-align:left;width:100%;padding:10px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(244,237,227,.05),rgba(244,237,227,.015));backdrop-filter:blur(6px);transition:border-color .3s,transform .3s}
.row:hover{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.row:active{transform:scale(.985)}
.row .ph{position:relative;aspect-ratio:1;border-radius:19px;overflow:hidden;background:var(--card)}
.row .ph img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.row:hover .ph img{transform:scale(1.1)}
.row .ph .t3{position:absolute;right:7px;bottom:7px;font:800 9px var(--display);letter-spacing:.14em;padding:4px 7px;border-radius:6px;background:rgba(13,12,11,.75);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2)}
.row .info{display:flex;flex-direction:column;min-width:0;padding:4px 4px 2px 0}
.row h3{margin:2px 0 6px;font:800 19px/1.1 var(--display);letter-spacing:-.015em}
.row p{margin:0;color:var(--mute);font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .badges{margin-top:8px}
.row .foot{margin-top:auto;padding-top:8px;font-size:17px}
.row.out{opacity:.4;filter:grayscale(1)}
.empty{text-align:center;color:var(--mute);padding:60px 10px}

footer{margin-top:40px;text-align:center;color:var(--mute);font-size:12.5px;line-height:1.9}
footer .lk{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
footer .lk span{padding:7px 13px;border-radius:99px;border:1px solid var(--line)}
footer .own{display:inline-block;margin-top:14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6d655c;text-decoration:none}
footer .own:hover{color:var(--accent)}

/* ---------- ürün sayfası ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;pointer-events:none}
.sheet-wrap.on{pointer-events:auto}
.sheet-bg{position:absolute;inset:0;background:rgba(5,4,3,.7);backdrop-filter:blur(6px);opacity:0;transition:opacity .4s}
.sheet-wrap.on .sheet-bg{opacity:1}
.sheet{position:absolute;left:50%;bottom:0;width:100%;max-width:720px;max-height:96vh;overflow-y:auto;transform:translate(-50%,105%);transition:transform .6s cubic-bezier(.2,.9,.2,1);background:#12100e;border-radius:32px 32px 0 0;border:1px solid var(--line);border-bottom:0;padding-bottom:calc(26px + env(safe-area-inset-bottom));scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet-wrap.on .sheet{transform:translate(-50%,0)}
.close{position:absolute;right:14px;top:14px;z-index:6;width:42px;height:42px;border-radius:50%;background:rgba(13,12,11,.6);backdrop-filter:blur(10px);border:1px solid var(--line);display:grid;place-items:center}
.stage{position:relative;height:min(92vw,470px);overflow:hidden;background:radial-gradient(60% 55% at 50% 46%,#4a3e33 0,#1b1612 62%,#12100e 100%);border-radius:32px 32px 0 0}
.stage::before{content:"";position:absolute;left:10%;right:10%;bottom:12%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 70%,#12100e)}
.stage model-viewer{width:100%;height:100%;--poster-color:transparent;background:transparent;outline:none}
.stage .photo{position:absolute;inset:0}
.stage .photo img{width:100%;height:100%;object-fit:cover;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
.stage .hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:8px;white-space:nowrap;pointer-events:none}
.seg{position:absolute;left:14px;top:14px;z-index:6;display:flex;padding:4px;border-radius:99px;background:rgba(13,12,11,.6);backdrop-filter:blur(10px);border:1px solid var(--line)}
.seg button{padding:8px 15px;border-radius:99px;font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);transition:.25s}
.seg button.on{background:var(--ink);color:#14110d}
.thumbs{display:flex;gap:8px;padding:12px 18px 0;overflow-x:auto}
.thumb{flex:none;width:58px;height:58px;border-radius:14px;overflow:hidden;border:2px solid transparent;opacity:.55;transition:.25s}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.on{border-color:var(--accent);opacity:1}
.pbody{padding:18px 22px 0}
.pbody h2{margin:12px 0 4px;font:800 clamp(30px,8vw,40px)/1 var(--display);letter-spacing:-.03em}
.pbody .pr{font-size:26px;margin:8px 0 14px}
.pbody p{color:#cfc5b8;line-height:1.65;font-size:15px;margin:0 0 6px}
.pbody h4{margin:22px 0 10px;font:700 11px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.ing{display:flex;gap:7px;flex-wrap:wrap}
.ing span{padding:8px 13px;border-radius:99px;border:1px solid var(--line);font-size:13px;background:rgba(244,237,227,.03)}
.ar-btn{margin-top:26px;width:100%;padding:18px;border-radius:20px;font:800 16px var(--display);letter-spacing:.01em;color:#1a0b04;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--accent);position:relative;overflow:hidden;transition:transform .2s}
.ar-btn:active{transform:scale(.98)}
.ar-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-130%);animation:shine 3.4s infinite}
@keyframes shine{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}
.ar-note{text-align:center;color:var(--mute);font-size:11.5px;margin-top:10px}

/* ---------- Masanda gör (kamera yedeği) ---------- */
.ar{position:fixed;inset:0;z-index:100;background:#000;display:none;overflow:hidden;touch-action:none}
.ar.on{display:block}
.ar video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ar .nocam{position:absolute;inset:0;background:repeating-linear-gradient(95deg,rgba(0,0,0,.1) 0 3px,transparent 3px 11px),linear-gradient(180deg,#6a4a2e,#2a1a0e)}
.ar .item{position:absolute;left:0;top:0;width:62vw;max-width:360px;touch-action:none;will-change:transform}
.ar .item img{width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 22px 16px rgba(0,0,0,.5))}
.ar .item::before{content:"";position:absolute;left:6%;right:6%;bottom:-3%;height:12%;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);filter:blur(6px);z-index:-1}
.ar .top2{position:absolute;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top)) 14px 30px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(rgba(0,0,0,.6),transparent);z-index:3}
.ar .top2 b{font:800 17px var(--display)}
.ar .top2 button{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);font-size:18px}
.ar .panel{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:3;padding:12px 16px;border-radius:22px;background:rgba(18,16,14,.72);backdrop-filter:blur(16px);border:1px solid var(--line)}
.ar .panel label{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);margin:6px 0}
.ar .panel label span{width:66px}
.ar .panel input[type=range]{flex:1;accent-color:var(--accent)}
.ar .tip{position:absolute;left:50%;top:94px;transform:translateX(-50%);z-index:3;padding:9px 15px;border-radius:99px;background:rgba(0,0,0,.6);font-size:12.5px;text-align:center;transition:opacity .6s;max-width:90vw}

@media (min-width:640px){.cat .lbl b{font-size:23px}.row{grid-template-columns:150px 1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.stage .spin{position:absolute;inset:0;cursor:grab;touch-action:none;user-select:none}.stage .spin:active{cursor:grabbing}.stage .spin img{width:100%;height:100%;object-fit:cover;pointer-events:none}

/* ---- dil seçici ---- */
.tr-end{display:flex;align-items:center;gap:8px}
.lang{display:flex;padding:3px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.04)}
.lang button{padding:6px 9px;border-radius:99px;font:700 11px var(--body);letter-spacing:.06em;color:var(--mute);min-width:30px;transition:.2s}
.lang button.on{background:var(--accent);color:#1a0b04}
@media (max-width:380px){.open{display:none}}

/* ---- Arapça / sağdan sola ---- */
[dir=rtl] body,[dir=rtl] button,[dir=rtl] input,[dir=rtl] .brand b,[dir=rtl] .headline,[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] h4,[dir=rtl] .cat .lbl b,[dir=rtl] .pr b,[dir=rtl] .mark{font-family:'Cairo','Segoe UI',Tahoma,'Noto Sans Arabic',Arial,sans-serif}
[dir=rtl] *{letter-spacing:0!important;text-transform:none!important}
[dir=rtl] .headline{line-height:1.15}
[dir=rtl] .cat,[dir=rtl] .fcard,[dir=rtl] .row{text-align:right}
[dir=rtl] .cat .no{left:auto;right:16px}
[dir=rtl] .cat .go{right:auto;left:12px;transform:scaleX(-1)}
[dir=rtl] .cat .lbl{left:14px;right:16px}
[dir=rtl] .back svg{transform:scaleX(-1)}
[dir=rtl] .track{direction:ltr}
[dir=rtl] .search svg{left:auto;right:18px}
[dir=rtl] .search input{padding:16px 50px 16px 18px}
[dir=rtl] .close{left:14px;right:auto}
[dir=rtl] .lang,[dir=rtl] .lang button{font-family:'Segoe UI',Arial,sans-serif}

/* Yönetim paneli (index.html#yonetim) — tüm kurallar .adm altında, siteyle çakışmaz */
.adm{--a-bg:#f3f0eb;--a-panel:#fff;--a-ink:#1b1814;--a-mute:#7a7167;--a-line:#e5dfd6;--a-acc:#e2551c;--a-danger:#d64545;
  position:relative;min-height:100vh;background:var(--a-bg);color:var(--a-ink);font:14.5px/1.45 "DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.adm *{box-sizing:border-box}
.adm[hidden]{display:none}
.adm button,.adm input,.adm select,.adm textarea{font:inherit}
.adm .login{min-height:100vh;display:grid;place-items:center;padding:20px}
.adm .login .box{background:var(--a-panel);padding:34px;border-radius:24px;width:100%;max-width:390px;box-shadow:0 24px 70px rgba(0,0,0,.09);text-align:center}
.adm .login h1{margin:0 0 4px;font-size:24px;letter-spacing:-.02em}.adm .login p{color:var(--a-mute);margin:0 0 20px}
.adm .topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--a-line);display:flex;align-items:center;gap:10px;padding:12px 18px;flex-wrap:wrap}
.adm .topbar h1{font-size:17px;margin:0;flex:1;min-width:140px;letter-spacing:-.01em}
.adm .wrap{max-width:1000px;margin:0 auto;padding:18px}
.adm .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}
.adm .tab{padding:10px 16px;border-radius:12px;background:transparent;border:1px solid transparent;cursor:pointer;color:var(--a-mute);white-space:nowrap;font-weight:600}
.adm .tab.on{background:var(--a-panel);border-color:var(--a-line);color:var(--a-ink);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.adm .card{background:var(--a-panel);border:1px solid var(--a-line);border-radius:16px;padding:16px;margin-bottom:14px}
.adm .card h3{margin:0 0 12px;font-size:16px}
.adm .btn{padding:9px 16px;border-radius:10px;border:1px solid var(--a-line);background:var(--a-panel);cursor:pointer;font-weight:600;color:var(--a-ink);text-decoration:none;display:inline-block}
.adm .btn:hover{border-color:#b9ae9e}
.adm .btn.pri{background:var(--a-ink);color:#fff;border-color:var(--a-ink)}
.adm .btn.acc{background:var(--a-acc);color:#fff;border-color:var(--a-acc)}
.adm .btn.del{color:var(--a-danger)}
.adm .btn.sm{padding:6px 11px;font-size:13px}
.adm .btn[disabled]{opacity:.5;cursor:default}
.adm .row{display:flex;gap:12px;align-items:center}
.adm .toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.adm .item{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--a-line);border-radius:14px;margin-bottom:8px;background:#fff}
.adm .item img{width:60px;height:60px;border-radius:12px;object-fit:cover;background:#2a241d;flex:none}
.adm .item .meta{flex:1;min-width:0}.adm .item .meta b{display:block}.adm .item .meta small{color:var(--a-mute)}
.adm .item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.adm .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#eee7da;margin-right:4px}
.adm .tag.n{background:#e8f7b8;color:#3a4a0a}.adm .tag.c{background:#ffe0d2;color:#9a3410}.adm .tag.x{background:#ddd;color:#555}.adm .tag.d{background:#1b1814;color:#fff}
.adm label.f{display:block;margin-bottom:12px;font-size:13px;color:var(--a-mute)}
.adm label.f>input,.adm label.f>select,.adm label.f>textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;border-radius:10px;border:1px solid var(--a-line);background:#fff;color:var(--a-ink)}
.adm label.f>input[type=color]{padding:2px;height:42px}
.adm textarea{min-height:80px;resize:vertical}
.adm .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.adm .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.adm .checks{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 14px}
.adm .checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.adm .imgs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.adm .imgs .im{position:relative;width:96px;height:96px;border-radius:12px;overflow:hidden;border:2px solid var(--a-line);background:#2a241d}
.adm .imgs .im.main{border-color:var(--a-acc)}
.adm .imgs img{width:100%;height:100%;object-fit:cover}
.adm .imgs .x{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:0;cursor:pointer;line-height:1}
.adm .imgs .mk{position:absolute;left:4px;bottom:4px;font-size:10px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:6px;padding:2px 6px;cursor:pointer}
.adm .box3d{border:1px dashed #cfc5b6;border-radius:16px;padding:14px;margin:4px 0 16px;background:#fbf9f6}
.adm .box3d .pv{height:240px;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#4a3e33,#17130f);margin-bottom:12px;position:relative;display:grid;place-items:center;color:#cdbfae;font-size:13px;text-align:center;padding:10px}
.adm .box3d .pv model-viewer{width:100%;height:100%;--poster-color:transparent;background:transparent}
.adm .busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-weight:700}
.adm #modal .bg,.adm .modal .bg{position:fixed;inset:0;background:rgba(20,16,10,.6);z-index:200;display:grid;place-items:start center;overflow-y:auto;padding:30px 12px}
.adm .dlg{background:var(--a-panel);border-radius:22px;width:100%;max-width:680px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.adm .dlg h2{margin:0 0 14px;font-size:19px}
.adm .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:var(--a-ink);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;z-index:300;pointer-events:none;max-width:90vw;text-align:center}
.adm .toast.on{opacity:1;transform:translate(-50%,0)}
.adm .note{background:#fff3df;border:1px solid #f1d9a8;color:#6b4f12;padding:12px 14px;border-radius:12px;line-height:1.55;font-size:13.5px;margin-bottom:14px}
.adm .steps{padding-left:20px;line-height:1.8}
.adm .qr{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.adm .qr img{width:200px;height:200px;border:1px solid var(--a-line);border-radius:12px;background:#fff;padding:8px}
.adm .dirty{background:#ffe7c9;color:#8a4a00;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.adm code{background:#f0ebe3;padding:1px 6px;border-radius:6px;font-size:12.5px}
@media(max-width:600px){.adm .grid2,.adm .grid3{grid-template-columns:1fr}.adm .item{flex-wrap:wrap}.adm .item .acts{width:100%;justify-content:flex-start}}

.adm .box3d,.adm label:has(#f-ar){display:none!important}

</style>
</head>

  var KEY = 'qrmenu_draft_v2', DBN = 'qrmenu_assets', ST = 'a';

  }

  function save(d) {

    try { localStorage.setItem(KEY, JSON.stringify(d)); return true; } catch (e) { alert('Kayıt başarısız: tarayıcı hafızası dolu.'); return false; }
  }

  /* ---- ZIP (sıkıştırmasız) ---- */
  var CRC = (function () { var t = new Uint32Array(256); for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  /* taslaktaki yüklenmiş dosyalar + menu.js → yayın paketi */
  function buildPackage(d) {

})();

      if (p.modelType !== 'scan' && mv) { var t0 = performance.now(), stop = false; mv.addEventListener('camera-change', function (e) { if (e.detail && e.detail.source === 'user-interaction') stop = true; }); (function f() { if (stop || !mv.isConnected) return; mv.cameraOrbit = (Math.sin((performance.now() - t0) / 1500) * 30).toFixed(1) + 'deg 80deg auto'; requestAnimationFrame(f); })(); }
    } else if (mode === 'spin') {
      var fr = p.spin, n = fr.length; box.innerHTML = '<div class="spin" id="spin"><img src="' + esc(U(fr[0])) + '" alt="" draggable="false"></div><div class="hint">' + ic.rot + ' Sürükle · 360°</div>';
      fr.forEach(function (f) { var im = new Image(); im.src = U(f); });
      var el = document.getElementById('spin'), img = el.querySelector('img'), cur = 0, drag = false, lx = 0, acc = 0;
      function show(i) { cur = ((i % n) + n) % n; img.src = U(fr[cur]); }
      el.addEventListener('pointerdown', function (e) { drag = true; lx = e.clientX; stopSpin(); el.setPointerCapture(e.pointerId); box.querySelector('.hint').style.opacity = 0; });
      el.addEventListener('pointermove', function (e) { if (!drag) return; acc += (e.clientX - lx) * (n / (el.clientWidth * 0.9)); lx = e.clientX; if (Math.abs(acc) >= 1) { show(cur - Math.trunc(acc)); acc -= Math.trunc(acc); } });
      var up = function () { drag = false; }; el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
      spinTimer = setInterval(function () { if (!drag) show(cur + 1); }, 110);
    } else {
      box.innerHTML = '<div class="photo"><img src="' + esc(U(p.images[idx || 0] || '')) + '" alt=""></div>';
    }
  }
  function openSheet(id) {
    var p = prodById(id); if (!p) return;
    loadPreviewModel(p, function () {
      var modes = [], first = 'photo', hasM = false;
      var thumbs = (p.images || []).length > 1 ? '<div class="thumbs" id="thumbs">' + p.images.map(function (s, i) { return '<button class="thumb' + (i ? '' : ' on') + '" data-img="' + i + '"><img src="' + esc(U(s)) + '" alt=""></button>'; }).join('') + '</div>' : '';
      sheet.innerHTML = '<div class="sheet-bg" data-close></div><div class="sheet"><button class="close" data-close aria-label="' + t('close') + '">' + ic.close + '</button>' +
        '<div class="stage" id="stage">' + (modes.length > 1 ? '<div class="seg">' + modes.map(function (m, i) { return '<button' + (i ? '' : ' class="on"') + ' data-mode="' + m[0] + '">' + m[1] + '</button>'; }).join('') + '</div>' : '') + '<div id="stage-in" style="position:absolute;inset:0"></div>' +
        (hasM ? '<model-viewer id="armv" ' + mvAttrs(p, false) + ' style="position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0"><button slot="ar-button" style="display:none"></button></model-viewer>' : '') + '</div>' + thumbs +
        '<div class="pbody">' + badges(p) + '<h2>' + esc(tx(p, 'name')) + '</h2>' + priceHtml(p) + (tx(p, 'desc') ? '<p>' + esc(tx(p, 'desc')) + '</p>' : '') +
        ((tx(p, 'ingredients') || []).length ? '<h4>' + t('ing') + '</h4><div class="ing">' + tx(p, 'ingredients').map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div>' : '') +
        (false ? '<button class="ar-btn" data-ar="' + esc(p.id) + '">' + ic.cube + ' ' + esc(S.arButtonText || 'Masanda Gör') + '</button><div class="ar-note">Telefon kamerasıyla ürünü masanda gör</div>' : '') + '</div></div>';
      sheet.dataset.pid = p.id; sheet.classList.add('on'); document.body.style.overflow = 'hidden'; setStage(p, first, 0);
    });
  }
  function closeSheetUI() { stopSpin(); sheet.classList.remove('on'); document.body.style.overflow = ''; setTimeout(function () { if (!sheet.classList.contains('on')) sheet.innerHTML = ''; }, 600); }

  /* ---------- Masanda gör ---------- */
  var arStream = null;
  function openAR(id) {
    var p = prodById(id); if (!p) return;
    var src = U(p.cutout || mainImg(p));
    arEl.innerHTML = '<div class="nocam"></div><video playsinline muted autoplay></video><div class="item" id="ar-item"><img src="' + esc(src) + '" alt=""></div>' +
      '<div class="top2"><b>' + esc(p.name) + '</b><button id="ar-close" aria-label="' + t('close') + '">' + ic.close + '</button></div><div class="tip" id="ar-tip">Kamerayı masanıza doğrultun · Sürükleyin, iki parmakla büyütün/döndürün</div>' +
      '<div class="panel"><label><span>Boyut</span><input type="range" id="ar-size" min="30" max="260" value="100"></label><label><span>Döndür</span><input type="range" id="ar-rot" min="-40" max="40" value="0"></label><label><span>Şeffaflık</span><input type="range" id="ar-op" min="35" max="100" value="96"></label></div>';
    arEl.classList.add('on');
    var video = arEl.querySelector('video'), nocam = arEl.querySelector('.nocam'), item = document.getElementById('ar-item'), tip = document.getElementById('ar-tip');
    var st = { x: innerWidth / 2, y: innerHeight * 0.52, s: 1, r: 0, o: 0.96 };
    function paint() { var w = item.offsetWidth, h = item.offsetHeight; item.style.opacity = st.o; item.style.transform = 'translate(' + (st.x - w / 2) + 'px,' + (st.y - h / 2) + 'px) rotate(' + st.r + 'deg) scale(' + st.s + ')'; }
    item.querySelector('img').onload = paint; paint();
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }).then(function (s) { arStream = s; video.srcObject = s; video.play(); nocam.style.display = 'none'; })
        .catch(function () { tip.textContent = 'Kamera izni verilmedi — masa dokusu üzerinde gösteriliyor.'; });
    } else tip.textContent = 'Bu cihazda kamera erişimi yok (HTTPS gerekir).';
    setTimeout(function () { tip.style.opacity = 0; }, 6500);
    var ptrs = {}, sD = 0, sA = 0, sS = 1, sR = 0;
    item.addEventListener('pointerdown', function (e) { item.setPointerCapture(e.pointerId); ptrs[e.pointerId] = { x: e.clientX, y: e.clientY }; var k = Object.keys(ptrs); if (k.length === 2) { var a = ptrs[k[0]], b = ptrs[k[1]]; sD = Math.hypot(a.x - b.x, a.y - b.y); sA = Math.atan2(b.y - a.y, b.x - a.x); sS = st.s; sR = st.r; } });
    item.addEventListener('pointermove', function (e) {
      if (!ptrs[e.pointerId]) return; var k = Object.keys(ptrs);
      if (k.length === 1) { st.x += e.clientX - ptrs[e.pointerId].x; st.y += e.clientY - ptrs[e.pointerId].y; }
      ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
      if (k.length === 2) { var a = ptrs[k[0]], b = ptrs[k[1]]; st.s = Math.min(2.6, Math.max(.3, sS * Math.hypot(a.x - b.x, a.y - b.y) / sD)); st.r = sR + (Math.atan2(b.y - a.y, b.x - a.x) - sA) * 180 / Math.PI; document.getElementById('ar-size').value = st.s * 100; }
      paint();
    });
    function end(e) { delete ptrs[e.pointerId]; }
    item.addEventListener('pointerup', end); item.addEventListener('pointercancel', end);
    document.getElementById('ar-size').oninput = function (e) { st.s = e.target.value / 100; paint(); };
    document.getElementById('ar-rot').oninput = function (e) { st.r = +e.target.value; paint(); };
    document.getElementById('ar-op').oninput = function (e) { st.o = e.target.value / 100; paint(); };
    document.getElementById('ar-close').onclick = closeAR;
  }
  function closeAR() { if (arStream) { arStream.getTracks().forEach(function (t) { t.stop(); }); arStream = null; } arEl.classList.remove('on'); arEl.innerHTML = ''; }

  /* ---------- yönlendirme (düz #isim biçimi) ---------- */
  function showAdmin() {
    closeSheetUI(); closeAR(); document.body.classList.add('admin-mode'); adminEl.hidden = false;
    if (!adminMounted) { adminMounted = true; Admin.mount(adminEl); } else Admin.refresh();
    window.scrollTo(0, 0);
  }
  function route() {
    var h = location.hash || '', m;
    if (h === '#yonetim') { showAdmin(); return; }
    if (!adminEl.hidden) { adminEl.hidden = true; document.body.classList.remove('admin-mode'); D = Store.get(); S = D.settings; applyTheme(); app.innerHTML = ''; }
    if ((m = h.match(/^#p-(.+)$/))) {
      var p = prodById(decodeURIComponent(m[1])); if (!p) { location.hash = ''; return; }
      if (!app.innerHTML) renderCategory(p.categoryId);
      openSheet(p.id); return;
    }
    closeSheetUI();
    if ((m = h.match(/^#c-(.+)$/))) renderCategory(decodeURIComponent(m[1])); else renderHome();
  }
  function setLang(l) { L = l; try { localStorage.setItem('qrmenu_lang', l); } catch (e) { } applyTheme(); route(); }
  function go(h) { internalNav = true; location.hash = h; }

  document.addEventListener('click', function (e) {
    var lb = e.target.closest('[data-lang]'); if (lb) { setLang(lb.dataset.lang); return; }
    var t = e.target.closest('[data-p],[data-c],[data-back],[data-close],[data-ar],[data-img],[data-mode]'); if (!t) return;
    if (t.dataset.mode) { var p0 = prodById(sheet.dataset.pid); [].forEach.call(document.querySelectorAll('.seg button'), function (b) { b.classList.toggle('on', b === t); }); setStage(p0, t.dataset.mode, 0); return; }
    if (t.dataset.ar) { var mv = document.getElementById('armv'); if (mv && mv.canActivateAR) mv.activateAR(); else openAR(t.dataset.ar); return; }
    if (t.dataset.img !== undefined && t.classList.contains('thumb')) {
      [].forEach.call(document.querySelectorAll('.thumb'), function (x) { x.classList.remove('on'); }); t.classList.add('on');
      var pp = prodById(sheet.dataset.pid); [].forEach.call(document.querySelectorAll('.seg button'), function (b) { b.classList.toggle('on', b.dataset.mode === 'photo'); }); setStage(pp, 'photo', +t.dataset.img); return;
    }
    if (t.dataset.p) { go('#p-' + encodeURIComponent(t.dataset.p)); return; }
    if (t.dataset.c) { go('#c-' + encodeURIComponent(t.dataset.c)); return; }
    if (t.hasAttribute('data-back')) { internalNav ? history.back() : (location.hash = ''); return; }
    if (t.hasAttribute('data-close')) { if (internalNav) history.back(); else { var m = (location.hash.match(/^#p-(.+)$/) || [])[1], pr = m && prodById(decodeURIComponent(m)); location.hash = pr ? '#c-' + pr.categoryId : ''; } }
  });
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (arEl.classList.contains('on')) closeAR(); else if (sheet.classList.contains('on')) history.back(); } });

  var started = false;
  function start() { if (started) return; started = true; D = Store.get(); S = D.settings; L = pickLang(); applyTheme(); route(); }
  Store.ready().then(start, start); setTimeout(start, 3500);
})();

</script>
