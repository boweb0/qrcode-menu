<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0c0b">
  <title>Menü</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="spot"></i><i class="grain"></i></div>

  <div id="sheet" class="sheet-wrap"></div>
